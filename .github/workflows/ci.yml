name: CI

# Default tests need no credentials or external services. Live acceptance is opt-in.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (development + server extras only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
      - name: Unit / integration / security tests
        run: python -m pytest tests -q
      - name: Ruff
        run: ruff check actionmesh tests scripts
      - name: Mypy
        run: mypy actionmesh

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Desktop tests
        run: npm test
