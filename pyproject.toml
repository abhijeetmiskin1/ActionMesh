[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actionmesh"
version = "0.1.0"
description = "Permission-aware, verifiable, cross-application AI execution platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]
server = ["uvicorn>=0.30"]

[project.scripts]
actionmesh = "actionmesh.cli:main"

[tool.setuptools.packages.find]
include = ["actionmesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated/regenerable trees: setuptools output and the downloaded Android
# toolchain (JDK + SDK). Linting them is noise, and the toolchain can be huge.
extend-exclude = ["build", "android-toolchain"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
